# Linux kernel config fragment: QEMU + Trusted Services (FF-A / S-EL1 SPMC)
#
# 在 qemu.conf 基础上叠加，用于 build/qemu_v8-psa-sp.mk。
# 参考 build/kconfigs/fvp_trusted-services.conf。

# FF-A 传输层（CONFIG_ARM_FFA_SMCCC 会随之自动开启）
CONFIG_ARM_FFA_TRANSPORT=y

# Trusted Services 客户端驱动，按 TS RPC UUID 匹配 SP，
# 为每个 TS SP 暴露一个 /dev/teeN
CONFIG_ARM_TSTEE=y

# TEE 子系统与 OP-TEE 驱动。
# 注意：FF-A 使能后 OP-TEE 驱动仍需保留 —— 其 ffa_abi 后端与 smc 后端
# 同在一个模块中注册，由固件拓扑决定谁 probe 成功。
CONFIG_TEE=y
CONFIG_OPTEE=y

# 便于运行时排查 FF-A 状态
CONFIG_DEBUG_FS=y
